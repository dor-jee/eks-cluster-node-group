<rect width="1200" height="960" fill="#ffffff"/>
<text x="30" y="40" font-size="24" font-weight="700" fill="#16212e">eks-cluster-node-group</text>
<text x="30" y="64" font-size="14" fill="#5b6b7b">EKS + managed node group + Cluster Autoscaler (IRSA), eu-central-2</text>

<!-- actors -->
<g><rect x="900" y="24" width="270" height="52" rx="8" fill="#f2f4f7" stroke="#8a97a6"/><text x="1035" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#16212e">Operator workstation</text><text x="1035" y="64" text-anchor="middle" font-size="12" fill="#5b6b7b">aws cli · kubectl · AWS Console</text></g>
<g><rect x="605" y="24" width="200" height="52" rx="8" fill="#f2f4f7" stroke="#8a97a6"/><text x="705" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#16212e">Internet users</text><text x="705" y="64" text-anchor="middle" font-size="12" fill="#5b6b7b">HTTP :80</text></g>

