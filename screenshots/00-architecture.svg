<g font-size="11" font-weight="700" text-anchor="middle" fill="#fff">
<circle cx="705" cy="150" r="10" fill="#37475a"/><text x="705" y="154">1</text>
<circle cx="650" cy="808" r="10" fill="#d86613"/><text x="650" y="812">2</text>
<circle cx="640" cy="320" r="10" fill="#d86613"/><text x="640" y="324">3</text>
</g>
<!-- legend -->
<g font-size="12" fill="#37475a">
<text x="36" y="918"><tspan font-weight="700">1</tspan> Users reach nginx through the internet-facing Classic Load Balancer (NodePort 30439).</text>
<text x="36" y="938"><tspan font-weight="700">2</tspan> The autoscaler pod's ServiceAccount token is exchanged at STS for temporary credentials (IRSA).   <tspan font-weight="700">3</tspan> It then adjusts the Auto Scaling group.</text>
</g>
</svg>
