<rect x="504" y="544" width="288" height="52" rx="6" fill="#eaf1fb" stroke="#2e73d1"/>
<text x="516" y="564" font-size="12" font-weight="700" fill="#1b4f9c">default</text>
<text x="516" y="582" font-size="11" fill="#16212e">nginx pod(s) reachable on NodePort 30439</text>
<text x="504" y="620" font-size="11" fill="#5b6b7b">scale range today: min 2 · desired 2 · max 2</text>

<!-- private subnets -->
<rect x="84" y="692" width="344" height="58" rx="6" fill="#f1f4f8" stroke="#8a97a6"/>
<text x="96" y="712" font-size="12" font-weight="700" fill="#4a5a6a">PrivateSubnet01 · 192.168.128.0/18</text>
<text x="96" y="730" font-size="11" fill="#5b6b7b">no workloads: nodes were placed in public subnets</text>
<rect x="476" y="692" width="344" height="58" rx="6" fill="#f1f4f8" stroke="#8a97a6"/>
<text x="488" y="712" font-size="12" font-weight="700" fill="#4a5a6a">PrivateSubnet02 · 192.168.192.0/18</text>
<text x="488" y="730" font-size="11" fill="#5b6b7b">no workloads</text>
<rect x="84" y="760" width="344" height="28" rx="6" fill="#ffffff" stroke="#8a97a6" stroke-dasharray="4 3"/>
<text x="256" y="778" text-anchor="middle" font-size="11" fill="#5b6b7b">NAT gateway + Elastic IP (provisioned, unused)</text>
<rect x="476" y="760" width="344" height="28" rx="6" fill="#ffffff" stroke="#8a97a6" stroke-dasharray="4 3"/>
<text x="648" y="778" text-anchor="middle" font-size="11" fill="#5b6b7b">NAT gateway + Elastic IP (provisioned, unused)</text>
<text x="452" y="836" text-anchor="middle" font-size="11" fill="#5b6b7b">ControlPlaneSecurityGroup on the EKS cross-account ENIs</text>

<!-- right column -->
<rect x="880" y="170" width="280" height="150" rx="8" fill="#fdf1f4" stroke="#c7254e" stroke-width="1.5"/>
<text x="1020" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#9c1a3c">Amazon EKS control plane</text>
<text x="1020" y="210" text-anchor="middle" font-size="11" fill="#5b6b7b">AWS-managed · cluster eks-cluster-test</text>
<text x="1020" y="232" text-anchor="middle" font-size="11" fill="#16212e">Kubernetes 1.37 · public + private endpoint</text>
<text x="1020" y="250" text-anchor="middle" font-size="11" fill="#16212e">Auth: EKS API + ConfigMap</text>
<text x="1020" y="268" text-anchor="middle" font-size="11" fill="#16212e">Role: eks-cluster-role (AmazonEKSClusterPolicy)</text>
<text x="1020" y="290" text-anchor="middle" font-size="11" fill="#5b6b7b">OIDC issuer URL for the cluster</text>

<rect x="880" y="360" width="280" height="150" rx="8" fill="#fff4e8" stroke="#d86613" stroke-width="1.5"/>
<text x="1020" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#a64a00">EC2 Auto Scaling group</text>
<text x="1020" y="400" text-anchor="middle" font-size="11" fill="#5b6b7b">behind managed node group eks-node-group</text>
<text x="1020" y="424" text-anchor="middle" font-size="11" fill="#16212e">min 2 · desired 2 · max 2 (scale-out blocked)</text>
<text x="1020" y="442" text-anchor="middle" font-size="11" fill="#16212e">Describe*, SetDesiredCapacity,</text>
<text x="1020" y="458" text-anchor="middle" font-size="11" fill="#16212e">TerminateInstanceInAutoScalingGroup</text>
<text x="1020" y="480" text-anchor="middle" font-size="11" fill="#5b6b7b">node role eks-node-group-role</text>

<rect x="880" y="550" width="280" height="196" rx="8" fill="#f3f0fb" stroke="#8c4fff" stroke-width="1.5"/>
<text x="1020" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#5a2fb0">IAM · IRSA</text>
<text x="1020" y="594" text-anchor="middle" font-size="11" fill="#16212e">1 IAM OIDC identity provider (cluster issuer)</text>
<text x="1020" y="612" text-anchor="middle" font-size="11" fill="#16212e">Web identity role EKSServiceAccountRole</text>
<text x="1020" y="628" text-anchor="middle" font-size="11" fill="#5b6b7b">audience sts.amazonaws.com</text>
<text x="1020" y="646" text-anchor="middle" font-size="11" fill="#16212e">Policy ClusterAutoscalerPolicy</text>
<text x="1020" y="670" text-anchor="middle" font-size="11" fill="#16212e">AWS STS · AssumeRoleWithWebIdentity</text>
<text x="1020" y="696" text-anchor="middle" font-size="11" fill="#9c5a00">no subject condition on the trust policy yet</text>
<text x="1020" y="714" text-anchor="middle" font-size="11" fill="#9c5a00">(see Known limitations)</text>

