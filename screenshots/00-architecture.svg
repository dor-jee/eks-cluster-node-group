<text x="66" y="208" font-size="11" fill="#5b6b7b">created by CloudFormation stack eks-worker-node-vpc-stack (22 resources)</text>

<!-- Internet gateway -->
<rect x="640" y="222" width="130" height="30" rx="6" fill="#ffffff" stroke="#8c4fff"/><text x="705" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#5a2fb0">Internet gateway</text>

