<text x="452" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#a64a00">Classic Load Balancer (internet-facing) · created by Service type LoadBalancer</text>
<text x="452" y="302" text-anchor="middle" font-size="11" fill="#7a4a1a">listener :80 → NodePort 30439 · 2 of 2 instances InService</text>

