<rect x="70" y="326" width="372" height="520" rx="8" fill="#ffffff" stroke="#8a97a6" stroke-dasharray="5 4"/>
<text x="84" y="346" font-size="13" font-weight="700" fill="#16212e">Availability Zone eu-central-2a</text>
