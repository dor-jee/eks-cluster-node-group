<rect x="84" y="360" width="344" height="316" rx="6" fill="#eef7e8" stroke="#3f8624"/>
<text x="96" y="380" font-size="12" font-weight="700" fill="#2c6a15">PublicSubnet01 · 192.168.0.0/18</text>
<rect x="476" y="360" width="344" height="316" rx="6" fill="#eef7e8" stroke="#3f8624"/>
<text x="488" y="380" font-size="12" font-weight="700" fill="#2c6a15">PublicSubnet02 · 192.168.64.0/18</text>

<!-- node A -->
<rect x="98" y="392" width="316" height="268" rx="6" fill="#ffffff" stroke="#d86613" stroke-width="1.5"/>
<text x="112" y="412" font-size="13" font-weight="700" fill="#a64a00">EC2 worker node · t3.small · AL2023</text>
<text x="112" y="428" font-size="11" fill="#5b6b7b">ip-192-168-30-126 · managed node group eks-node-group</text>
<rect x="112" y="442" width="288" height="88" rx="6" fill="#eaf1fb" stroke="#2e73d1"/>
<text x="124" y="462" font-size="12" font-weight="700" fill="#1b4f9c">kube-system</text>
<text x="124" y="480" font-size="11" fill="#16212e">cluster-autoscaler (1 replica, v1.37.0)</text>
<text x="124" y="496" font-size="11" fill="#16212e">CoreDNS · kube-proxy · aws-node (VPC CNI)</text>
<text x="124" y="512" font-size="11" fill="#5b6b7b">ServiceAccount cluster-autoscaler → IAM role</text>
<rect x="112" y="544" width="288" height="52" rx="6" fill="#eaf1fb" stroke="#2e73d1"/>
<text x="124" y="564" font-size="12" font-weight="700" fill="#1b4f9c">default</text>
<text x="124" y="582" font-size="11" fill="#16212e">nginx Deployment + LoadBalancer Service</text>
<text x="112" y="620" font-size="11" fill="#5b6b7b">max ENI 3 · max IPs 12 per node (~11 pods)</text>
<text x="112" y="636" font-size="11" fill="#5b6b7b">tag k8s.io/cluster-autoscaler/enabled</text>
<text x="112" y="652" font-size="11" fill="#5b6b7b">tag k8s.io/cluster-autoscaler/eks-cluster-test</text>

<!-- node B -->
<rect x="490" y="392" width="316" height="268" rx="6" fill="#ffffff" stroke="#d86613" stroke-width="1.5"/>
<text x="504" y="412" font-size="13" font-weight="700" fill="#a64a00">EC2 worker node · t3.small · AL2023</text>
<text x="504" y="428" font-size="11" fill="#5b6b7b">ip-192-168-110-238 · managed node group eks-node-group</text>
<rect x="504" y="442" width="288" height="88" rx="6" fill="#eaf1fb" stroke="#2e73d1"/>
<text x="516" y="462" font-size="12" font-weight="700" fill="#1b4f9c">kube-system</text>
<text x="516" y="480" font-size="11" fill="#16212e">CoreDNS · kube-proxy · aws-node (VPC CNI)</text>
